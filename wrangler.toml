name = "codehost"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "codehost-db"
database_id = "codehost-db"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "codehost-files"

[vars]
JWT_SECRET = "change-me-in-production"

[observability]
enabled = true